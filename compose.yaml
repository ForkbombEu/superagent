# Coolify Git Repository > Build strategy: Compose.
# In Coolify > Domains, assign https://DASHBOARD_DOMAIN to service "dashboard" on port 8080;
# DASHBOARD_DOMAIN must be exactly that hostname, or DSH answers 403 on /api.
# Coolify must be using its Caddy proxy (not Traefik).
services:
  superagent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SUPERAGENT_REF: main
    init: true
    restart: unless-stopped
    stop_grace_period: 5m
    command:
      - dsh
      - --profile
      - superagent
      - --public-url
      - https://${DASHBOARD_DOMAIN:?Set DASHBOARD_DOMAIN to the hostname of the Coolify domain of the dashboard service}/
      - --trusted-host
      - ${DASHBOARD_DOMAIN:?Set DASHBOARD_DOMAIN to the hostname of the Coolify domain of the dashboard service}
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?}
      GH_TOKEN: ${GH_TOKEN:?}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:?}
      DSH_TELEMETRY_MODE: DISABLED
      # Optional Superagent settings applied on every start (scripts/superagent-configure).
      SUPERAGENT_GITHUB_ALLOWED_USERS: ${SUPERAGENT_GITHUB_ALLOWED_USERS:-}
      SUPERAGENT_EXECUTOR_PROVIDER: ${SUPERAGENT_EXECUTOR_PROVIDER:-}
      SUPERAGENT_EXECUTOR_MODEL: ${SUPERAGENT_EXECUTOR_MODEL:-}
      SUPERAGENT_EXECUTOR_REASONING_EFFORT: ${SUPERAGENT_EXECUTOR_REASONING_EFFORT:-}
    volumes:
      - superagent_home:/home/agent
    tmpfs:
      - /run/superagent-secrets:uid=10001,gid=10001,mode=0700
    expose:
      - "3083"  # Docker-internal only; no host port mapping

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    depends_on:
      superagent:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8080"

volumes:
  superagent_home:
