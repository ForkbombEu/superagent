# Local browser access only. Coolify uses compose.yaml alone and must not load
# this file (it would publish 8080 on the host).
#
#   docker compose -f compose.yaml -f compose.dev.yaml up --build
services:
  dashboard:
    ports:
      # 8080 is often taken by other local Superagent stacks; use 18080 here.
      - "18080:8080"
  superagent:
    # Host the browser sends must match --trusted-host / --public-url.
    environment:
      SERVICE_URL_DASHBOARD: http://localhost:18080
      SERVICE_FQDN_DASHBOARD: localhost
