# The trusted UAT controller for a repository worked on by a dsh-superagent
# deployment (https://github.com/ForkbombEu/superagent, templates/superagent-uat.yml).
# Copy it to .github/workflows/superagent-uat.yml on the default branch and
# replace each 0000000000000000000000000000000000000000 with the full commit
# SHA of the superagent version to run. README.md, "User acceptance tests",
# lists the GitHub App, environments and ruleset it needs.
#
# Workflows run from the default branch for these events, never from the pull
# request; the pull request's code runs only inside the test job's sandbox.
name: superagent-uat

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  issues:
    types: [edited]
  repository_dispatch:
    types: [superagent-uat]

permissions: {}

# One run per pull request at a time; a newer request waits and then tests the
# current head, so stale results never overwrite current ones.
concurrency:
  group: superagent-uat-${{ github.event.pull_request.number || github.event.client_payload.pr || format('issue-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  start:
    if: github.event_name != 'issues'
    runs-on: ubuntu-24.04
    # Holds SUPERAGENT_UAT_APP_PRIVATE_KEY; deployment branches: the default branch only.
    environment: superagent-uat
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
    outputs:
      run: ${{ steps.controller.outputs.run }}
      snapshot: ${{ steps.controller.outputs.snapshot }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SUPERAGENT_UAT_CLIENT_ID }}
          private-key: ${{ secrets.SUPERAGENT_UAT_APP_PRIVATE_KEY }}
          permission-checks: write
      - id: controller
        uses: ForkbombEu/superagent/uat@0000000000000000000000000000000000000000
        with:
          command: start
          app-id: ${{ vars.SUPERAGENT_UAT_APP_ID }}
          check-token: ${{ steps.app.outputs.token }}
          read-token: ${{ github.token }}
          environments: local

  test:
    needs: start
    if: needs.start.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Holds DEEPSEEK_API_KEY only; deployment branches: the default branch only.
    environment: superagent-uat-tester
    permissions:
      contents: read
    steps:
      - uses: ForkbombEu/superagent/uat@0000000000000000000000000000000000000000
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SUPERAGENT_UAT_MODEL: ${{ vars.SUPERAGENT_UAT_MODEL }}
        with:
          command: test
          app-id: ${{ vars.SUPERAGENT_UAT_APP_ID }}
          read-token: ${{ github.token }}
          snapshot: ${{ needs.start.outputs.snapshot }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: superagent-uat
          path: ${{ runner.temp }}/superagent-uat/out
          retention-days: 30
          include-hidden-files: true

  finish:
    needs: [start, test]
    if: always() && needs.start.outputs.run == 'true'
    runs-on: ubuntu-24.04
    environment: superagent-uat
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: superagent-uat
          path: ${{ runner.temp }}/superagent-uat/out
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SUPERAGENT_UAT_CLIENT_ID }}
          private-key: ${{ secrets.SUPERAGENT_UAT_APP_PRIVATE_KEY }}
          permission-checks: write
      - uses: ForkbombEu/superagent/uat@0000000000000000000000000000000000000000
        with:
          command: finish
          app-id: ${{ vars.SUPERAGENT_UAT_APP_ID }}
          check-token: ${{ steps.app.outputs.token }}
          read-token: ${{ github.token }}
          snapshot: ${{ needs.start.outputs.snapshot }}
          test-result: ${{ needs.test.result }}

  route:
    if: github.event_name == 'issues'
    runs-on: ubuntu-24.04
    environment: superagent-uat
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SUPERAGENT_UAT_CLIENT_ID }}
          private-key: ${{ secrets.SUPERAGENT_UAT_APP_PRIVATE_KEY }}
          permission-checks: write
      - uses: ForkbombEu/superagent/uat@0000000000000000000000000000000000000000
        with:
          command: route
          app-id: ${{ vars.SUPERAGENT_UAT_APP_ID }}
          check-token: ${{ steps.app.outputs.token }}
          read-token: ${{ github.token }}
