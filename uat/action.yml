name: Superagent UAT controller
description: >-
  One step of the trusted superagent-uat workflow (templates/superagent-uat.yml):
  start, test, finish or route. Use it pinned to a full commit SHA. The policy
  (UAT_ENVIRONMENTS, UAT_MAX_FAILED_ROUNDS, UAT_TESTER_TIMEOUT_MINUTES,
  UAT_PREVIEW_*) comes from the workflow's env, the same for every job.
inputs:
  command:
    description: start, test, finish or route
    required: true
  app-id:
    description: Numeric id of the GitHub App that publishes superagent/uat (filters its check runs)
    required: true
  check-token:
    description: Installation token of that App (start, finish, route); never given to test
    default: ''
  read-token:
    description: A read-only token for this repository, normally github.token
    required: true
  snapshot:
    description: The start job's snapshot output (test, finish)
    default: ''
  test-result:
    description: needs.test.result (finish)
    default: ''
outputs:
  run:
    description: '"true" when the start job created a run for test and finish'
    value: ${{ steps.controller.outputs.run }}
  snapshot:
    description: What test and finish are bound to (base64 JSON)
    value: ${{ steps.controller.outputs.snapshot }}
runs:
  using: composite
  steps:
    - name: Ensure PyYAML
      shell: bash
      run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq python3-yaml; }
    - id: controller
      name: Run the controller
      shell: bash
      working-directory: ${{ github.action_path }}/..
      env:
        UAT_COMMAND: ${{ inputs.command }}
        UAT_APP_ID: ${{ inputs.app-id }}
        UAT_CHECK_TOKEN: ${{ inputs.check-token }}
        UAT_READ_TOKEN: ${{ inputs.read-token }}
        UAT_SNAPSHOT: ${{ inputs.snapshot }}
        UAT_TEST_RESULT: ${{ inputs.test-result }}
      run: python3 -m uat.controller "$UAT_COMMAND"
