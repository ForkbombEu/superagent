# DSH --patch overlay (see compose.yaml) for the official Claude Code subagent bundle,
# which provides the `subagent_claude_code` tool the Delivery requirements use for PR
# review. Image-owned, so it applies to existing profiles in the superagent_home volume.
# Read-only enforcement lives in /etc/claude-code/managed-settings.json.
- id: subagent-claude-code
  config:
    # Deny every operation the managed settings do not pre-approve.
    permissionMode: dontAsk
    # Reviewer model, e.g. `opus`, `sonnet` or a full model id; unset uses Claude
    # Code's default for the account.
    model: !!js "process.env.SUPERAGENT_REVIEWER_MODEL || undefined"
    # The provider scrubs credentials from the inherited environment; pass whichever
    # Claude Code credential the deployment sets, never writing it to disk, and the
    # reviewer's effort level as CLAUDE_CODE_EFFORT_LEVEL when set.
    env: !!js |-
      Object.fromEntries([
        ...['ANTHROPIC_API_KEY', 'CLAUDE_CODE_OAUTH_TOKEN'].map(name => [name, process.env[name]]),
        ['CLAUDE_CODE_EFFORT_LEVEL', process.env.SUPERAGENT_REVIEWER_EFFORT],
      ].filter(([, value]) => value))
